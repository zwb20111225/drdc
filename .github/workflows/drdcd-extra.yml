name: Build drdcd with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_drdcinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_drdc.ko ./userspace/drdcd/bin/aarch64/
        cp x86_64-android*-lkm/*_drdc.ko ./userspace/drdcd/bin/x86_64/
    
    - name: Prepare drdcinit
      if: ${{ inputs.pack_drdcinit }}
      run: |
        mv drdcinit-aarch64/drdcinit ./userspace/drdcd/bin/aarch64/
        mv drdcinit-x86_64/drdcinit ./userspace/drdcd/bin/x86_64/
        mv drdcinit-riscv64/drdcinit ./userspace/drdcd/bin/riscv64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/drdcd
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/drdcd/.lkm_image_bootstrap.o \
          userspace/drdcd/src/lkm_image_bootstrap.S

    - name: Build drdcd
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/drdcd/Cargo.toml

    - name: Upload drdcd artifact
      uses: actions/upload-artifact@v7
      with:
        name: drdcd-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/drdcd*
