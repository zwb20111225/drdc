name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename drdcd
        run: |
          mkdir -p drdcd
          for dir in ./drdcd-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                drdcd_platform_name=$(basename "$dir")
                if [ -f "$dir/drdcd" ]; then
                  mv "$dir/drdcd" "drdcd/$drdcd_platform_name"
                elif [ -f "$dir/drdcd.exe" ]; then
                  mv "$dir/drdcd.exe" "drdcd/$drdcd_platform_name.exe"
                fi
            fi
          done

      - name: Rename drdcinit
        run: |
          mkdir -p drdcinit
          for dir in ./drdcinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                drdcinit_platform_name=$(basename "$dir")
                if [ -f "$dir/drdcinit" ]; then
                  mv "$dir/drdcinit" "drdcinit/$drdcinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_drdc.ko"
                KO="$(ls $dir/*_drdc.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manager/*.apk
            lkm/lkm-*_drdc.ko
            drdcd/drdcd-*
            drdcinit/*
